:root{
  --accent:#2F6B5E; --accentSoft:#E3EFEB;
  --bg:#F6F5F1; --surface:#FFFFFF; --ink:#1E2321; --sub:#6B7370; --mute:#9AA19E; --line:#E7E5DF;
  --red:#C2493A; --redSoft:#FBE9E5; --amber:#B8741A;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* 히어로 */
.head{position:relative;overflow:hidden;padding:26px 20px 118px;color:#fff;background:linear-gradient(180deg,var(--heroA,#24305A) 0%,var(--heroB,#C35F6B) 58%,var(--heroC,#F7C893) 100%)}
.head>*{position:relative}
.scene-box{position:absolute!important;left:0;right:0;bottom:-1px;line-height:0;pointer-events:none}
.scene-box svg{width:100%;height:auto;display:block}
.head.photo{padding-bottom:74px;border-radius:0 0 28px 28px;background:linear-gradient(180deg,rgba(10,14,30,.38),rgba(10,14,30,.72)),var(--img) center/cover}
.head.photo .scene-box{display:none}
.brand{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.01em;background:rgba(14,18,40,.28);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;opacity:.8;margin-top:22px}
.title{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.15;text-shadow:0 2px 14px rgba(10,14,40,.28)}
.dates{font-size:14px;opacity:.92;margin-top:5px;font-weight:500}
.hchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:16px -20px 0;padding:0 20px}
.hchips::-webkit-scrollbar{display:none}
.hchip{flex:none;font-size:12px;font-weight:600;background:rgba(14,18,40,.28);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:5px 11px;color:#fff}

.view{padding:14px 16px 0}

/* 다음 일정 카드 */
.next{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;padding:14px 16px;margin:-6px 0 14px;box-shadow:0 8px 20px rgba(30,35,33,.08);position:relative;z-index:2}
.next-k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.next-t{font-size:18px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.next-s{font-size:13px;color:var(--sub);margin-top:2px}

/* 세그먼트 · 칩 */
.seg{position:sticky;top:0;z-index:20;display:flex;gap:4px;background:rgba(246,245,241,.9);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:8px 0;margin-bottom:6px}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-size:13px;font-weight:600;color:var(--sub);background:var(--surface);border:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--sub);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px;white-space:nowrap}
.chip em{font-style:normal;font-size:11px;color:var(--mute);font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on em{color:rgba(255,255,255,.75)}
.chip.zero{opacity:.55}

/* 일 헤더 */
.day{margin-top:8px}
.day-h{display:flex;align-items:baseline;gap:10px;padding:10px 4px 8px}
.day-n{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.06em}
.day-d{font-size:16px;font-weight:700;letter-spacing:-.02em}
.day-t{font-size:12.5px;color:var(--sub);margin-left:auto}

/* 타임라인 */
.tl{position:relative}
.tl-i{display:flex;gap:10px;position:relative;padding-bottom:10px}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:62px;top:34px;bottom:-2px;width:1.5px;background:var(--line)}
.tl-time{width:42px;flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--sub);padding-top:11px;font-variant-numeric:tabular-nums}
.tl-dot{width:22px;height:22px;border-radius:50%;flex:none;margin-top:7px;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;z-index:1;background:var(--tint,#EEE)}
.tl-card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tl-title{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.tl-desc{font-size:12.5px;color:var(--sub);margin-top:3px}
.t-meal{--tint:#FCEBD7}.t-hotel{--tint:#E3E8F6}.t-move{--tint:#ECEEED}.t-meeting{--tint:#FBE0DA}.t-activity{--tint:#DDEEE8}.t-snack{--tint:#FBE1EA}.t-shopping{--tint:#EBE1F5}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;font-weight:600;border-radius:7px;padding:3px 8px;background:#F0EFEA;color:#56605C}
.tag.res{background:var(--redSoft);color:var(--red)}
.tag.car{background:#EEF0F6;color:#4C5A8A}
.tag.free{background:var(--accentSoft);color:var(--accent)}
.tag.must{background:#FFF1DC;color:var(--amber)}
.tag.cost{background:var(--accentSoft);color:var(--accent)}

/* 주소 · 내비 */
.loc{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.loc-row{display:flex;align-items:center;gap:8px}
.loc-row svg{flex:none;width:15px;height:15px;stroke:var(--mute);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.loc-addr{flex:1;min-width:0;font-size:12.5px;color:var(--ink);word-break:keep-all}
.loc-addr.warn{color:var(--red);font-weight:600}
.copy{flex:none;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accentSoft);border-radius:8px;padding:5px 10px}
.loc-nav{display:flex;gap:6px;margin-top:8px}
.loc-nav a{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--ink);background:#F3F2EE;border-radius:9px;padding:7px 0}
.loc-nav a:active,.copy:active{opacity:.6}

/* 맛집 · 후보지 카드 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
.card-top{display:flex;align-items:flex-start;gap:10px}
.rk{flex:none;font-size:11px;font-weight:800;color:var(--accent);background:var(--accentSoft);border-radius:7px;padding:3px 8px;margin-top:2px}
.card-name{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.card-meta{font-size:12px;color:var(--sub);margin-top:2px}
.rate{margin-left:auto;flex:none;text-align:right;font-size:15px;font-weight:800;color:var(--amber);line-height:1.1}
.rate small{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:2px}
.kv{margin-top:10px;display:grid;grid-template-columns:62px 1fr;gap:5px 10px;font-size:12.5px}
.kv dt{color:var(--mute);font-weight:600}
.kv dd{color:var(--ink)}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:36px 0;line-height:1.7}
.stat{font-size:11px;font-weight:700;color:var(--mute);background:#F0EFEA;border-radius:7px;padding:3px 8px;display:inline-block;margin-top:8px}
.blk-t{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin:14px 4px 8px}
.warnv{color:var(--red);font-weight:600}

/* 하단 탭바 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.bar-in{pointer-events:auto;width:100%;max-width:480px;display:flex;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--mute);font-size:10.5px;font-weight:600}
.tb svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--accent)}
.tb.on svg{stroke-width:2.1}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.22s;z-index:99;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:11px;color:var(--mute);margin:22px 0 4px}
.fade{animation:up .28s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>

  var SCENES = {

<defs><radialGradient id="gl"><stop offset="0" style="stop-color:var(--heroSun);stop-opacity:.85"/><stop offset="1" style="stop-color:var(--heroSun);stop-opacity:0"/></radialGradient>
<g id="hk"><path d="M0 40Q26 40 38 24H138Q150 40 176 40Q154 48 140 44H36Q22 48 0 40Z"/><rect x="34" y="19" width="108" height="5" rx="2.5"/><rect x="44" y="44" width="88" height="26"/><rect x="36" y="70" width="104" height="5"/></g>
<g id="wd"><rect x="54" y="50" width="20" height="16" rx="1"/><rect x="78" y="50" width="20" height="16" rx="1"/><rect x="102" y="50" width="20" height="16" rx="1"/></g></defs>
<circle cx="292" cy="92" r="64" fill="url(#gl)"/>
<circle cx="292" cy="92" r="21" style="fill:var(--heroSun)"/>
<path d="M0 104C50 84 90 92 140 100C200 110 240 86 300 94C340 100 370 92 390 98V150H0Z" fill="#141a38" fill-opacity=".28"/>
<path d="M0 118C60 104 110 112 170 116C230 120 290 104 390 114V150H0Z" fill="#141a38" fill-opacity=".45"/>
<g style="fill:var(--heroInk)">
<use href="#hk" transform="translate(236 84) scale(.62)" opacity=".88"/>
<use href="#hk" transform="translate(28 56)"/>
<path transform="translate(-14 0)" d="M8 134L16 112H11L19 92H14L22 70L30 92H25L33 112H28L36 134Z"/>
<path transform="translate(352 6)" d="M8 134L16 112H11L19 92H14L22 70L30 92H25L33 112H28L36 134Z"/>
</g>
<g fill="#FFD79A" fill-opacity=".8"><use href="#wd" transform="translate(28 56)"/><use href="#wd" transform="translate(236 84) scale(.62)"/></g>
<path d="M120 44q5-6 10 0q5-6 10 0M148 58q4-5 8 0q4-5 8 0" stroke="#fff" stroke-opacity=".65" fill="none" stroke-width="1.3" stroke-linecap="round"/>
<path d="M0 132C70 124 130 134 200 130C270 126 330 134 390 128V150H0Z" style="fill:var(--bg)"/>
</svg>`
  };
  if (T.heroImage) {
    var hd = document.querySelector('.head'); hd.classList.add('photo'); hd.style.setProperty('--img', 'url("' + T.heroImage + '")');
  } else if (SCENES[T.scene]) { $('h-scene').innerHTML = SCENES[T.scene]; }
  $('h-en').textContent = T.en || '';
  $('h-title').textContent = T.title || '';
  $('h-dates').textContent = T.dates || '';
  $('h-chips').innerHTML = (T.chips || []).map(function(c){ return '<span class="hchip">' + esc(c) + '</span>'; }).join('');

  function loc(q, addr){
    if (!q && !addr) return '';
    var s = q || addr;
    return '<div class="loc"><div class="loc-row">' + PIN +
      '<span class="loc-addr' + (addr ? '' : ' warn') + '">' + esc(addr || '주소 확인 필요') + '</span>' +
      (addr ? '<button class="copy" data-copy="' + esc(addr) + '">복사</button>' : '') + '</div>' +
      '<div class="loc-nav">' + NAV.map(function(n){ return '<a href="' + n[1](s) + '"' + (n[2] ? ' data-app="' + esc(addr || s) + '"' : ' target="_blank" rel="noopener"') + '>' + n[0] + '</a>'; }).join('') + '</div></div>';
  }
  function chips(cats, items, cur, key){
    var all = [{ id:'all', label:'전체', emoji:'' }].concat(cats || []);
    return '<div class="chips">' + all.map(function(c){
      var n = c.id === 'all' ? items.length : items.filter(function(i){ return i.cat === c.id; }).length;
      return '<button class="chip' + (cur === c.id ? ' on' : '') + (n ? '' : ' zero') + '" data-k="' + key + '" data-c="' + esc(c.id) + '">' + (c.emoji ? c.emoji + ' ' : '') + esc(c.label) + '<em>' + n + '</em></button>';
    }).join('') + '</div>';
  }
  function catLabel(cats, id){ var c = (cats || []).filter(function(x){ return x.id === id; })[0]; return c ? (c.emoji + ' ' + c.label) : ''; }

  /* 다음 일정 */
  function nextCard(){
    var days = T.days || []; if (!days.length) return '';
    var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    function d0(iso){ var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    var first = d0(days[0].iso), last = d0(days[days.length - 1].iso);
    var diff = Math.round((first - today) / 86400000);
    var k, t, s;
    if (diff > 0) { k = 'D-' + diff + ' · 첫 일정'; var it = days[0].items[0]; t = it.title; s = days[0].label + ' · ' + it.time; }
    else if (today > last) { k = '여행 끝'; t = '수고하셨어요'; s = T.title; }
    else {
      var hm = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2), found = null, dayL = '';
      days.forEach(function(d){ if (d0(d.iso).getTime() === today.getTime()) { dayL = d.label; d.items.forEach(function(i){ if (!found && i.at && i.at >= hm) found = i; }); } });
      if (found) { k = '다음 일정'; t = found.title; s = dayL + ' · ' + found.time; } else { k = '오늘'; t = '남은 일정 없음'; s = dayL; }
    }
    return '<div class="next fade"><div class="next-k">' + esc(k) + '</div><div class="next-t">' + esc(t) + '</div><div class="next-s">' + esc(s) + '</div></div>';
  }

  var S = { tab: null, day: 'all', cat: { food: 'all', spots: 'all', park: 'all' } };

  function schedule(){
    var days = T.days || [];
    var seg = '<div class="seg"><button class="' + (S.day === 'all' ? 'on' : '') + '" data-d="all">전체</button>' +
      days.map(function(d){ return '<button class="' + (S.day === d.id ? 'on' : '') + '" data-d="' + esc(d.id) + '">' + esc(d.label) + '</button>'; }).join('') + '</div>';
    var body = days.filter(function(d){ return S.day === 'all' || S.day === d.id; }).map(function(d){
      var items = d.items.map(function(it){
        var ty = it.type || 'move';
        var tags = (it.badges || []).map(function(b){ return '<span class="tag ' + esc(b.t) + '">' + esc(b.x) + '</span>'; }).join('') + (it.cost ? '<span class="tag cost">' + esc(it.cost) + '</span>' : '');
        return '<div class="tl-i fade"><div class="tl-time">' + esc(it.time) + '</div><div class="tl-dot t-' + esc(ty) + '">' + (ICON[ty] || '•') + '</div>' +
          '<div class="tl-card"><div class="tl-title">' + esc(it.title) + '</div>' + (it.desc ? '<div class="tl-desc">' + esc(it.desc) + '</div>' : '') +
          (tags ? '<div class="tags">' + tags + '</div>' : '') + loc(it.map, it.addr) + '</div></div>';
      }).join('');
      return '<section class="day"><div class="day-h"><span class="day-n">DAY ' + esc(d.num) + '</span><span class="day-d">' + esc(d.date) + '</span><span class="day-t">' + esc(d.theme) + '</span></div><div class="tl">' + items + '</div></section>';
    }).join('');
    return nextCard() + seg + body;
  }

  function food(){
    var list = T.restaurants || [], cur = S.cat.food;
    var rows = list.filter(function(r){ return cur === 'all' || r.cat === cur; });
    var body = rows.map(function(r){
      var kv = [['대표 메뉴', r.menu], ['가격', r.price], ['영업시간', r.hours], ['주차', r.parking], ['아이 동반', r.kids], ['메모', r.note]]
        .filter(function(x){ return x[1]; }).map(function(x){ return '<dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('');
      return '<div class="card fade"><div class="card-top">' + (r.rank ? '<span class="rk">' + esc(r.rank) + '</span>' : '') +
        '<div><div class="card-name">' + esc(r.name) + '</div><div class="card-meta">' + esc(catLabel(T.menuCats, r.cat)) + (r.meal ? ' · ' + esc(r.meal) : '') + '</div></div>' +
        (r.rating ? '<div class="rate">★ ' + Number(r.rating).toFixed(1) + '<small>구글 ' + Number(r.reviews || 0).toLocaleString() + '</small></div>' : '') + '</div>' +
        '<dl class="kv">' + kv + '</dl>' + loc(r.map, r.addr) + '</div>';
    }).join('');
    return chips(T.menuCats, list, cur, 'food') + (body || '<div class="empty">아직 후보가 없어요<br>구글맵 조사 후 채웁니다</div>');
  }

  function spots(){
    var list = T.spots || [], cur = S.cat.spots;
    var rows = list.filter(function(r){ return cur === 'all' || r.cat === cur; });
    var body = rows.map(function(r){
      return '<div class="card fade"><div class="card-top"><div><div class="card-name">' + esc(r.name) + '</div><div class="card-meta">' + esc(catLabel(T.spotCats, r.cat)) + '</div></div>' +
        (r.rating ? '<div class="rate">★ ' + Number(r.rating).toFixed(1) + '<small>구글 ' + Number(r.reviews || 0).toLocaleString() + '</small></div>' : '') + '</div>' +
        (r.desc ? '<div class="card-meta" style="margin-top:8px;color:var(--ink)">' + esc(r.desc) + '</div>' : '') +
        (r.status ? '<span class="stat">' + esc(r.status) + '</span>' : '') + loc(r.map, r.addr) + '</div>';
    }).join('');
    return chips(T.spotCats, list, cur, 'spots') + (body || '<div class="empty">이 카테고리는 아직 비어 있어요<br>조사 후 채웁니다</div>');
  }

  function stay(){
    return (T.stay || []).map(function(b){
      var kv = b.rows.map(function(r){ return '<dt>' + esc(r[0]) + '</dt><dd' + (r[2] ? ' class="warnv"' : '') + '>' + esc(r[1]) + '</dd>'; }).join('');
      return '<div class="card fade"><div class="card-name">' + esc(b.title) + '</div><dl class="kv" style="grid-template-columns:78px 1fr">' + kv + '</dl>' + loc(b.map, b.addr) + '</div>';
    }).join('');
  }
  function park(){
    var list = T.parking || [], cur = S.cat.park;
    var rows = list.filter(function(r){ return cur === 'all' || r.cat === cur; });
    var body = rows.map(function(r){
      var kv = [['요금', r.fee], ['운영시간', r.hours], ['규모', r.size], ['도보', r.walk], ['메모', r.note]]
        .filter(function(x){ return x[1]; }).map(function(x){ return '<dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('');
      return '<div class="card fade"><div class="card-top">' + (r.rank ? '<span class="rk">' + esc(r.rank) + '</span>' : '') +
        '<div><div class="card-name">' + esc(r.name) + '</div><div class="card-meta">' + esc(catLabel(T.parkCats, r.cat)) + (r.kind ? ' · ' + esc(r.kind) : '') + '</div></div>' +
        (r.rating ? '<div class="rate">★ ' + Number(r.rating).toFixed(1) + '<small>구글 ' + Number(r.reviews || 0).toLocaleString() + '</small></div>' : '') + '</div>' +
        '<dl class="kv">' + kv + '</dl>' + loc(r.map, r.addr) + '</div>';
    }).join('');
    return chips(T.parkCats, list, cur, 'park') + (body || '<div class="empty">아직 주차장 정보가 없어요</div>');
  }
  function snack(){
    return (T.snacks || []).map(function(s){
      return '<div class="card fade"><div class="card-top"><span class="rk">' + esc(s.date) + '</span><div class="card-name">' + esc(s.name) + '</div></div>' +
        '<dl class="kv">' + (s.hours ? '<dt>시간</dt><dd>' + esc(s.hours) + '</dd>' : '') + (s.items ? '<dt>추천</dt><dd>' + esc(s.items) + '</dd>' : '') + (s.dist ? '<dt>거리</dt><dd>' + esc(s.dist) + '</dd>' : '') + '</dl>' + loc(s.map, s.addr) + '</div>';
    }).join('');
  }
  function mart(){
    return (T.mart || []).map(function(m){
      return '<div class="card fade"><div class="card-top"><div class="card-name">' + esc((m.icon || '🏪') + ' ' + m.name) + '</div></div>' +
        '<dl class="kv">' + (m.hours ? '<dt>시간</dt><dd>' + esc(m.hours) + '</dd>' : '') + (m.items ? '<dt>추천</dt><dd>' + esc(m.items) + '</dd>' : '') + (m.tip ? '<dt>팁</dt><dd>' + esc(m.tip) + '</dd>' : '') + '</dl>' + loc(m.map, m.addr) + '</div>';
    }).join('');
  }

  var defs = [['schedule', (T.days || []).length, schedule], ['food', (T.restaurants || []).length, food], ['spots', (T.spots || []).length, spots],
              ['park', (T.parking || []).length, park], ['stay', (T.stay || []).length, stay], ['snack', (T.snacks || []).length, snack], ['mart', (T.mart || []).length, mart]]
    .filter(function(d){ return d[1] > 0; });
  var L = T.tabLabels || {};
  S.tab = defs[0][0];

  $('bar').innerHTML = defs.map(function(d){
    return '<button class="tb" data-t="' + d[0] + '"><svg viewBox="0 0 24 24">' + SVG[d[0]] + '</svg><span>' + esc(L[d[0]] || d[0]) + '</span></button>';
  }).join('');

  function render(){
    var fn = defs.filter(function(d){ return d[0] === S.tab; })[0][2];
    $('view').innerHTML = fn() + '<div class="foot">' + esc(T.title) + ' · Travel Dashboard v3.2</div>';
    document.querySelectorAll('.tb').forEach(function(b){ b.classList.toggle('on', b.dataset.t === S.tab); });
  }
  var tt;
  function toast(m){ var e = $('toast'); e.textContent = m; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ e.classList.remove('show'); }, 1500); }
  function copy(txt, msg){
    function fb(){ var a = document.createElement('textarea'); a.value = txt; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast(msg || '주소를 복사했어요'); } catch (e) { toast('복사 실패 · 길게 눌러 복사하세요'); } document.body.removeChild(a); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function(){ toast(msg || '주소를 복사했어요'); }, fb); else fb();
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-t],[data-d],[data-c],[data-copy],[data-app]'); if (!t) return;
    if (t.dataset.app) { e.preventDefault(); copy(t.dataset.app, '주소 복사됨 · TMAP 검색창에 붙여넣으세요'); var h = t.getAttribute('href'); setTimeout(function(){ window.location.href = h; }, 250); return; }
    if (t.dataset.copy) { copy(t.dataset.copy); return; }
    if (t.dataset.t) { S.tab = t.dataset.t; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.d) { S.day = t.dataset.d; render(); return; }
    if (t.dataset.c) { S.cat[t.dataset.k] = t.dataset.c; render(); }
  });
  render();
})();
</script>
</body>
</html>
